<svg width="220" height="42" viewBox="0 0 220 42" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dm_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="dm_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="dm_glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>
    <filter id="dm_shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Emblem Icon Badge (42x42) -->
  <g filter="url(#dm_shadow)">
    <!-- Squircle Background -->
    <rect x="1" y="1" width="40" height="40" rx="10" fill="url(#dm_bg)" stroke="#10b981" stroke-width="1.2" />
    <rect x="2" y="2" width="38" height="18" rx="8" fill="url(#dm_glow)" />

    <!-- Stylized House Pinnacle (Real Estate & Agreement Authority) -->
    <path d="M12 21L21 11L30 21" stroke="url(#dm_gold)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M26 14.5V11H29V17.5" stroke="url(#dm_gold)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Stylized 'D' Monogram Foundation -->
    <path d="M15 19V32H22C25.5 32 28 29.5 28 25.5C28 21.5 25.5 19 22 19H15Z" fill="#ffffff" fill-opacity="0.95" />
    <path d="M18 22H21.5C23.5 22 25 23.5 25 25.5C25 27.5 23.5 29 21.5 29H18V22Z" fill="url(#dm_bg)" />

    <!-- Golden Foundation Bar -->
    <rect x="13" y="32.5" width="16" height="2" rx="1" fill="url(#dm_gold)" />
  </g>

  <!-- Typography: DASHMESH PROPERTIES -->
  <g>
    <!-- Brand Name: DASHMESH -->
    <text x="49" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="16.5" letter-spacing="0.8" fill="#0f172a">DASHMESH</text>
    
    <!-- Sub Brand: PROPERTIES -->
    <text x="50" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="9.5" letter-spacing="2.2" fill="#047857">PROPERTIES</text>
    
    <!-- Location Pill -->
    <rect x="144" y="24" width="70" height="12" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.8" />
    <text x="148" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="7.5" letter-spacing="0.5" fill="#065f46">AMBERNATH</text>
  </g>
</svg>